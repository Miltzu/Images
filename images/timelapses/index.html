
<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101114">
  <title>Timelapses | Miltzu Images</title>
  <meta name="description" content="Timelapse videos and projects by Miltzu.">

  <style>
    :root {
      color-scheme: dark;
      --bg: #101114;
      --panel: #191a20;
      --border: #30313a;
      --text: #f3f4f6;
      --muted: #a4a6b2;
      --accent: #a7c7ff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, sans-serif;
      line-height: 1.6;
    }

    a { color: inherit; }

    .site-header {
      border-bottom: 1px solid var(--border);
      background: #141519;
    }

    .header-inner {
      max-width: 1200px;
      margin: auto;
      padding: 18px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }

    .brand {
      font-size: 1.15rem;
      font-weight: 750;
      text-decoration: none;
    }

    .brand span { color: var(--muted); }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .back-link {
      color: var(--muted);
      text-decoration: none;
    }

    .back-link:hover { color: var(--text); }

    button {
      font: inherit;
      cursor: pointer;
    }

    .lang-btn {
      padding: 5px 9px;
      border: 1px solid var(--border);
      border-radius: 7px;
      background: transparent;
      color: var(--muted);
    }

    .lang-btn.active {
      background: #303746;
      color: white;
      border-color: #566580;
    }

    main {
      max-width: 1200px;
      margin: auto;
      padding: 56px 24px 80px;
    }

    .eyebrow {
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: .15em;
      font-size: .8rem;
      font-weight: 700;
    }

    h1 {
      margin: 8px 0;
      font-size: clamp(2.2rem, 6vw, 4rem);
      line-height: 1.12;
      letter-spacing: -.04em;
    }

    .intro {
      max-width: 650px;
      color: var(--muted);
      margin: 16px 0 36px;
    }

    .video-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 24px;
    }

    .video-card {
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--panel);
      min-width: 0;
    }

    .video-card video {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #08090b;
      object-fit: contain;
    }

    .video-info { padding: 18px; }

    .video-info h2 {
      margin: 0 0 6px;
      font-size: 1.15rem;
    }

    .video-info p {
      margin: 0;
      color: var(--muted);
      font-size: .94rem;
    }

    .empty {
      color: var(--muted);
      padding: 28px;
      border: 1px dashed var(--border);
      border-radius: 12px;
    }

    footer {
      border-top: 1px solid var(--border);
      padding: 24px;
      text-align: center;
      color: var(--muted);
      font-size: .9rem;
    }

    @media (max-width: 680px) {
      .video-grid { grid-template-columns: 1fr; }
      main { padding-top: 36px; }
      .header-inner { padding: 16px; }
    }
  </style>
</head>

<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="../index.html">
        Miltzu <span>Images</span>
      </a>

      <div class="header-actions">
        <a class="back-link" href="../index.html"
           data-fi="← Takaisin galleriaan"
           data-en="← Back to gallery">
          ← Takaisin galleriaan
        </a>

        <div aria-label="Language">
          <button class="lang-btn active" data-lang="fi">FI</button>
          <button class="lang-btn" data-lang="en">EN</button>
        </div>
      </div>
    </div>
  </header>

  <main>
    <div class="eyebrow">Miltzu Images / Video</div>

    <h1 data-fi="Timelapses" data-en="Timelapses">
      Timelapses
    </h1>

    <p class="intro"
       data-fi="Timelapse-videoita, yötaivaita ja maisemia. Valitse video ja käynnistä toisto."
       data-en="Timelapse videos, night skies and landscapes. Select a video to start playback.">
      Timelapse-videoita, yötaivaita ja maisemia.
      Valitse video ja käynnistä toisto.
    </p>

    <section id="video-grid" class="video-grid"
             aria-label="Timelapse videos"></section>
  </main>

  <footer>
    © <span id="year"></span> Miltzu Images
  </footer>

  <script>
    // Add new videos here.
    // The video files must be inside this timelapses folder.
    const videos = [];

    let language = "fi";

    const grid = document.getElementById("video-grid");

    function renderVideos() {
      grid.replaceChildren();

      if (videos.length === 0) {
        const empty = document.createElement("p");
        empty.className = "empty";
        empty.textContent = language === "fi"
          ? "Videoita lisätään tänne myöhemmin."
          : "Videos will be added here soon.";
        grid.appendChild(empty);
        return;
      }

      videos.forEach(video => {
        const card = document.createElement("article");
        card.className = "video-card";

        const player = document.createElement("video");
        player.controls = true;
        player.preload = "metadata";
        player.playsInline = true;

        const source = document.createElement("source");
        source.src = video.file;
        source.type = "video/mp4";

        player.appendChild(source);

        const info = document.createElement("div");
        info.className = "video-info";

        const title = document.createElement("h2");
        title.textContent = video.title[language];

        const description = document.createElement("p");
        description.textContent = video.description[language];

        info.append(title, description);
        card.append(player, info);
        grid.appendChild(card);
      });
    }

    function setLanguage(lang) {
      language = lang;
      document.documentElement.lang = lang;

      document.querySelectorAll("[data-fi][data-en]")
        .forEach(element => {
          element.textContent = element.dataset[lang];
        });

      document.querySelectorAll(".lang-btn")
        .forEach(button => {
          const active = button.dataset.lang === lang;
          button.classList.toggle("active", active);
          button.setAttribute("aria-pressed", active);
        });

      renderVideos();
    }

    document.querySelectorAll(".lang-btn").forEach(button => {
      button.addEventListener("click", () => {
        setLanguage(button.dataset.lang);
      });
    });

    document.getElementById("year").textContent =
      new Date().getFullYear();

    setLanguage("fi");
  </script>
</body>
</html>
