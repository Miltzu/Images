<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Miltzu Images — Astrokuvat</title>
<meta name="description" content="Miltzun astrokuvia: deep sky, planeetat, Kuu, Aurinko ja revontulet.">

<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css?v=30">
<script src="script.js?v=26"></script>
<script src="https://cdn.jsdelivr.net/npm/exif-js"></script>
</head>
<body>

<div id="starfield"></div>

<header class="site-header">
  <div class="site-header-inner">
    <a class="brand" href="index.html">Miltzu <span>Images</span></a>
    <nav class="site-nav">
      <a href="index.html" class="active" data-fi="Galleria" data-en="Gallery">Galleria</a>
      <a href="taivas.html" data-fi="Taivas" data-en="Sky">Taivas</a>
      <a href="projektit.html" data-fi="Projektit" data-en="Projects">Projektit</a>
      <a href="prosessointi.html" data-fi="Prosessointi" data-en="Processing">Prosessointi</a>
      <a href="equipment.html" data-fi="Laitteisto" data-en="Equipment">Laitteisto</a>
      <a href="loki.html" data-fi="Loki" data-en="Log">Loki</a>
    </nav>
    <a class="social-link" href="https://www.instagram.com/M1ltzu/" target="_blank" rel="noopener me">Instagram</a>
    <div class="lang-switch">
      <button class="lang-btn active" data-lang="fi">FI</button>
      <button class="lang-btn" data-lang="en">EN</button>
    </div>
  </div>
</header>

<main class="page">

  <!-- Uusin kuva isona. script.js täyttää images.json:n viimeisellä kuvalla
       (tai sillä, jolla on "featured": true). -->
  <section id="featured" class="featured is-loading">
    <div class="featured-media">
      <img id="featuredImg" alt="">
    </div>
    <div class="featured-body">
      <span class="featured-eyebrow" data-fi="Uusin kuva" data-en="Latest image">Uusin kuva</span>
      <h1 id="featuredTitle" class="featured-title" data-fi="Astrokuvausta ja muuta" data-en="Astrophotography and stuff">Astrokuvausta ja muuta</h1>
      <p id="featuredMeta" class="featured-meta"></p>
      <p id="featuredDesc" class="featured-desc"></p>
      <div class="featured-actions">
        <button id="featuredOpen" class="btn btn-primary" type="button">
          <span data-fi="Avaa kuva" data-en="Open image">Avaa kuva</span>
        </button>
        <a class="btn btn-ghost" href="#gallery-head" data-fi="Kaikki kuvat" data-en="All images">Kaikki kuvat</a>
      </div>
    </div>
  </section>

  <div id="gallery-head" class="section-head">
    <div>
      <h2 data-fi="Kuvagalleria" data-en="Image Gallery">Kuvagalleria</h2>
      <p data-fi="Astrokuvia, tietenkin" data-en="Astrophotography images, obviously">Astrokuvia, tietenkin</p>
    </div>
  </div>

  <div class="gallery-toolbar">
    <div class="gallery-tabs">
      <button class="tab-btn active" data-category="all" data-fi="Kaikki" data-en="All">Kaikki</button>
      <button class="tab-btn" data-category="deepsky" data-fi="Deepsky" data-en="Deep sky">Deepsky</button>
      <button class="tab-btn" data-category="narrowband" data-fi="Kapeakaista" data-en="Narrowband">Kapeakaista</button>
      <button class="tab-btn" data-category="planeetta" data-fi="Planeetta" data-en="Planets">Planeetta</button>
      <button class="tab-btn" data-category="kuu" data-fi="Kuu" data-en="Moon">Kuu</button>
      <button class="tab-btn" data-category="aurinko" data-fi="Aurinko" data-en="Sun">Aurinko</button>
      <button class="tab-btn" data-category="revontuli" data-fi="Revontuli" data-en="Aurora">Revontuli</button>
      <button class="tab-btn" data-category="widefield" data-fi="Laajakulma" data-en="Wide field">Laajakulma</button>
    </div>

    <div class="view-toggle">
      <button class="view-btn" data-view="compact" title="Vain kuvat" aria-label="Vain kuvat">
        <svg viewBox="0 0 20 20" fill="currentColor">
          <rect x="1" y="1" width="4.5" height="4.5" rx="1"/>
          <rect x="7.75" y="1" width="4.5" height="4.5" rx="1"/>
          <rect x="14.5" y="1" width="4.5" height="4.5" rx="1"/>
          <rect x="1" y="7.75" width="4.5" height="4.5" rx="1"/>
          <rect x="7.75" y="7.75" width="4.5" height="4.5" rx="1"/>
          <rect x="14.5" y="7.75" width="4.5" height="4.5" rx="1"/>
        </svg>
      </button>
      <button class="view-btn active" data-view="info" title="Infojen kanssa" aria-label="Infojen kanssa">
        <svg viewBox="0 0 20 20" fill="currentColor">
          <rect x="1" y="1" width="18" height="11" rx="1.5"/>
          <rect x="1" y="14.5" width="18" height="2" rx="1"/>
          <rect x="1" y="17.5" width="11" height="2" rx="1"/>
        </svg>
      </button>
    </div>
  </div>

  <section id="gallery" class="gallery"></section>

</main>


<!-- lightbox -->
<div id="lightbox" class="lightbox" onclick="closeLightbox()">
  <button id="lightboxClose" class="lightbox-close" type="button" aria-label="Sulje" title="Sulje">
    <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
      <path d="M5 5l10 10M15 5L5 15"/>
    </svg>
  </button>
  <button id="lightboxPrev" class="lightbox-nav lightbox-prev" aria-label="Edellinen">‹</button>
  <button id="lightboxNext" class="lightbox-nav lightbox-next" aria-label="Seuraava">›</button>

  <!-- kehys rajaa näkymän; kuva ja koordinaattiruudukko zoomautuvat yhdessä -->
  <div id="lbFrame" class="lb-frame">
    <div id="lbStage" class="lb-stage">
      <img id="lightbox-img" alt="">
      <svg id="skyGrid" class="sky-grid" aria-hidden="true"></svg>
    </div>
  </div>

  <a id="lightboxDownload" class="lightbox-download" download title="Lataa kuva" aria-label="Lataa kuva">
    <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5">
      <path d="M10 2v10M10 12l-4-4M10 12l4-4"/>
      <path d="M3 16h14"/>
    </svg>
  </a>

  <div class="lb-tools">
    <button id="infoBtn" class="lb-tool" type="button">
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5">
        <circle cx="10" cy="10" r="8"/>
        <path d="M10 9v5M10 6.2v.1"/>
      </svg>
      <span data-fi="Tiedot" data-en="Info">Tiedot</span>
    </button>
    <button id="skyLocationBtn" class="lb-tool sky-location-btn" type="button">
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4">
        <path d="M2 7c5-2 11-2 16 0M2 13c5 2 11 2 16 0"/>
        <path d="M7 2c-2 5-2 11 0 16M13 2c2 5 2 11 0 16"/>
        <rect x="1.5" y="1.5" width="17" height="17" rx="3"/>
      </svg>
      <span data-fi="Koordinaatit" data-en="Coordinates">Koordinaatit</span>
    </button>
  </div>

  <div id="text" class="caption"></div>
</div>

<footer class="footer">
  <div class="footer-content">
    <span>Miltzu</span>
    <span>•</span>
    <span>© 2026</span>
    <a class="footer-link" href="loki.html" data-fi="Päivitysloki" data-en="Update log">Päivitysloki</a>
    <a class="social-link" href="https://www.instagram.com/M1ltzu/" target="_blank" rel="noopener me">@M1ltzu</a>
  </div>
</footer>

</body>
</html>
