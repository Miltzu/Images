<script>
/* Aikaviivevideot
   Lisää video listaan. Videotiedosto (mp4) kansioon images/timelapses/.
   { "file": "images/timelapses/video.mp4",
     "poster": "images/timelapses/video.jpg",            (vapaaehtoinen kansikuva)
     "title": { "fi": "Nimi", "en": "Title" },
     "desc":  { "fi": "Kuvaus", "en": "Description" },     (vapaaehtoinen)
     "date": "16.11.2026" }                                (vapaaehtoinen) */
(function () {
  const videos = [];

  const host = document.getElementById("timelapses");
  const L = () => (document.documentElement.lang === "en" ? "en" : "fi");
  const tr = (v) => (v && typeof v === "object") ? String(v[L()] || v.fi || v.en || "") : String(v || "");
  const esc = (s) => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  function render() {
    if (!videos.length) {
      host.innerHTML = `
        <div class="empty-card">
          <h2>${L() === "en" ? "No videos yet" : "Videoita ei ole vielä lisätty"}</h2>
          <p>${L() === "en" ? "Timelapse videos will be added here soon." : "Tänne tulee pian timelapse-videoita."}</p>
        </div>`;
      return;
    }
    host.innerHTML = `<ul class="tl-grid">${videos.map(v => `
      <li class="tl-card">
        <video controls preload="metadata" playsinline${v.poster ? ` poster="${esc(v.poster)}"` : ""}>
          <source src="${esc(v.file)}" type="video/mp4">
        </video>
        <div class="tl-body">
          ${v.date ? `<time>${esc(v.date)}</time>` : ""}
          <h2>${esc(tr(v.title))}</h2>
          ${v.desc ? `<p>${esc(tr(v.desc))}</p>` : ""}
        </div>
      </li>`).join("")}</ul>`;
  }
  render();
  document.addEventListener("langchange", render);
})();
</script>
