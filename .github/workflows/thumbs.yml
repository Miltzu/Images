# Tekee esikatselukuvat (images/thumbs/) ja näyttöversiot (images/large/)
# automaattisesti aina kun images/-kansioon lisätään tai siinä muutetaan kuva.
name: Esikatselukuvat

on:
  push:
    branches: [main]
    paths:
      - "images/*.jpg"
      - "images/*.jpeg"
      - "images/*.png"
      - "images/*.JPG"
      - "images/*.JPEG"
      - "images/*.PNG"
      - "make_thumbs.py"
  workflow_dispatch: # voi ajaa myös käsin Actions-välilehdeltä

permissions:
  contents: write # versioiden committaus takaisin repoon
  pages: write    # sivuston julkaisun pyytäminen

concurrency:
  group: thumbs
  cancel-in-progress: false

jobs:
  thumbs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Asenna Pillow
        run: pip install pillow

      - name: Tee esikatselukuvat ja näyttöversiot
        run: python make_thumbs.py

      - name: Tallenna uudet versiot repoon
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/thumbs images/large
          if git diff --cached --quiet; then
            echo "Ei uusia kuvia käsiteltäväksi."
            exit 0
          fi
          git commit -m "Esikatselukuvat päivitetty automaattisesti"
          git pull --rebase
          git push
          # Botin tekemä push ei käynnistä sivuston julkaisua itsestään, joten pyydetään se erikseen
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Julkaisupyyntö ei onnistunut, sivu päivittyy seuraavalla pushilla."
